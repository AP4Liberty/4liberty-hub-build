<!-- wp:html -->
<div class="fl-ticker">
	<div class="fl-ticker__row">
		<!-- Real live/dark state, not a static claim — assets/js/ticker.js
		     unhides this only when something in the roster is actually live
		     right now, same /api/live-state payload the homepage hero reads. -->
		<span class="fl-live-tag" data-fl="ticker-live-tag" hidden><span class="fl-pulse"></span>On Air</span>
		<!-- assets/js/ticker.js rotates through every enabled show's name +
		     schedule (4Liberty Hub → Live Shows), swapping to "is live right
		     now" for whichever one actually is. -->
		<span class="fl-ticker__feed" data-fl="ticker-feed"><b>4Liberty Network</b> — stay tuned.</span>
	</div>
</div>
<!-- /wp:html -->

		<!--
		  Plain static nav, NOT a wp:navigation block (2026-07-23). The block
		  version rendered the ENTIRE header template part empty on the live
		  site: this install has a stray empty wp_navigation post (id 24,
		  "Header navigation", from 2022) that the block latched onto instead
		  of its own inner links, taking the whole masthead down with it.
		  Static HTML — same approach as the wordmark above — can't be hijacked
		  by a database record, needs no ref/auto-created post, and has no
		  render callback that can fail. Mobile hamburger is handled by
		  assets/js/site.js + the .fl-nav-toggle / .fl-nav-menu rules in

		-->
